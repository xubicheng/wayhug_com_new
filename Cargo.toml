[package]
name = "wayhug-new"
version = "0.1.0"
edition = "2024"
description = "wayhug.com — 公益性读书平台（双语读书笔记 / 读者关系 / 文创）"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs"] }
maud = { version = "0.27", features = ["axum"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["compression-gzip", "set-header", "fs"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
subtle = "2"

# 2 vCPU / 2GB 服务器：控制并行链接峰值
[profile.release]
opt-level = 2
codegen-units = 1
strip = "symbols"
lto = false
